<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-Ink Dashboard</title>
<style>
:root{--paper:#d9d9d6;--card:#dededa;--ink:#2b2b2b;--mute:#6f6f6b;--line:#8a8a86;--bezel:#f3f3f1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bezel);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.screen{width:100%;max-width:980px;background:var(--paper);border:6px solid var(--bezel);outline:2px solid var(--line);border-radius:10px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 22px}
.left{display:grid;grid-template-rows:auto 1fr;gap:16px}
.loc{display:none}
.analog{display:block;margin:10px auto 6px;width:min(190px,60%);height:auto}
.analog .face{fill:none;stroke:var(--ink);stroke-width:3}
.analog .tk{stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.analog .tk.big{stroke-width:4}
.analog .hh,.analog .mh2{stroke:var(--ink);stroke-linecap:round}
.analog .hh{stroke-width:6}.analog .mh2{stroke-width:4}
.analog .sh{stroke:#c62828;stroke-width:2;stroke-linecap:round}
.analog .dot{fill:var(--ink)}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}.clockbox{min-width:0}.clocklabel{text-align:center;color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.08em;height:28px;display:flex;align-items:flex-start;justify-content:center;line-height:1.35;padding-top:4px}.clockbox .analog{width:min(150px,90%);margin:8px auto 4px}.clockbox .time{font-size:clamp(25px,4vw,38px);padding:3px 0 8px}
.time{text-align:center;font-size:clamp(36px,6vw,56px);font-weight:700;letter-spacing:.01em;padding:4px 0 10px;border-bottom:1.5px solid var(--line);line-height:1.1}
.wx{display:flex;align-items:center;justify-content:center;gap:22px;padding-top:14px}
.wx svg{width:54px;height:54px;stroke:var(--ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.temp{font-size:34px;font-weight:600}
.cond{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-top:2px}
.forecast{margin-top:14px;padding-top:12px;border-top:1.5px solid var(--line)}
.forecast-title{text-align:center;color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.12em;margin-bottom:8px}
.forecast-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.fc{text-align:center;padding:7px 3px;border:1px solid var(--line);border-radius:10px}
.fc-day{font-size:12px;color:var(--mute);font-weight:700}
.fc-icon{font-size:24px;line-height:1.2;margin:2px 0}
.fc-temp{font-size:14px;font-weight:700}
.fc-low{color:var(--mute);font-weight:500}
.daylight{margin-top:14px;padding-top:12px;border-top:1.5px solid var(--line)}
.daylight-title{text-align:center;color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.12em;margin-bottom:8px}
.sunrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;font-size:12px}
.sun-time{white-space:nowrap;font-weight:700}
.sunbar{position:relative;height:9px;border:1px solid var(--line);border-radius:9px;background:var(--bezel)}
.sunbar::before{content:"";position:absolute;left:0;right:0;top:3px;border-top:1px solid var(--line)}
.sunpos{position:absolute;top:-5px;width:17px;height:17px;border:2px solid var(--ink);border-radius:50%;background:var(--card);transform:translateX(-50%)}
.sunlabels{display:flex;justify-content:space-between;color:var(--mute);font-size:10px;margin-top:5px}

h2{margin:0 0 10px;text-align:center;font-size:20px;font-weight:600;letter-spacing:.06em;padding-bottom:10px;border-bottom:1.5px solid var(--line)}
.row{display:flex;justify-content:space-between;padding:7px 4px;font-size:16px}
.row span:first-child{color:var(--mute)}
.cal h2{font-size:28px;letter-spacing:.02em}
.mh{display:flex;align-items:center;justify-content:space-between}
.mh button{background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:36px;font-size:22px;line-height:1;cursor:pointer}
.mh button:active{background:var(--ink);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:8px}
.dow{color:var(--mute);font-size:14px;padding:6px 0}
.d{aspect-ratio:1.1;display:flex;align-items:center;justify-content:center;font-size:17px;border-radius:8px}
.d.today{background:var(--ink);color:var(--paper);font-weight:700}
.d{cursor:pointer;touch-action:manipulation;user-select:none}
.d.sel{outline:2px solid var(--ink);outline-offset:-2px}
.d.bm{background:#c62828;color:#fff;font-weight:700}
.d.today.bm{background:var(--ink);box-shadow:0 0 0 3px #c62828}
.d.we{color:var(--mute)}
.foot{margin-top:14px;padding-top:12px;border-top:1.5px solid var(--line);text-align:center;color:var(--mute);font-size:14px;line-height:1.6}
dialog{border:1.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:20px;width:min(340px,92vw)}
dialog label{display:block;font-size:13px;color:var(--mute);margin-top:10px}
dialog input,dialog select{width:100%;padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
dialog button{margin-top:16px;padding:8px 16px;border:1.5px solid var(--ink);border-radius:8px;background:var(--ink);color:var(--paper);font:inherit;cursor:pointer}
/* ---- inverted (dark) mode ---- */
html.inv{--paper:#050505;--card:#0b0b0b;--ink:#e8e8e4;--mute:#9a9a95;--line:#4a4a47;--bezel:#000}
.tools{margin-top:12px;text-align:center}
.tools button{background:none;border:1.5px solid var(--line);color:var(--ink);border-radius:10px;padding:6px 16px;font:inherit;font-size:14px;letter-spacing:.06em;cursor:pointer;touch-action:manipulation}
.tools button:active,.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.news{margin-top:14px;padding-top:12px;border-top:1.5px solid var(--line)}
.news-title{text-align:center;color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.12em;margin-bottom:7px}
.news-status{text-align:center;color:var(--mute);font-size:10px;margin-bottom:6px}
.news-list{display:grid;gap:5px}
.news-item{display:block;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:9px;padding:7px 8px;line-height:1.25}
.news-item:active{background:var(--ink);color:var(--paper)}
.news-item .nt{font-size:13px;font-weight:600}
.news-item .ns{font-size:10px;color:var(--mute);margin-top:3px}
.news-item:active .ns{color:var(--paper)}
@media (max-width:700px){.screen{grid-template-columns:1fr}.clocks{grid-template-columns:1fr 1fr}.clockbox .analog{width:min(135px,90%)}}
</style>
</head>
<body>
<main class="screen">
  <section class="left">
    <div class="card">
      <div class="loc" id="loc" title="Tap to edit">—</div>
      <div class="clocks"><div class="clockbox"><div class="clocklabel">NETHERLANDS</div>
      <svg class="analog" id="analog" viewBox="0 0 200 200" aria-label="Analog clock">
        <circle class="face" cx="100" cy="100" r="94"/>
        <g id="ticks"></g>
        <line class="hh gl" id="gh1" x1="100" y1="100" x2="100" y2="58"/>
        <line class="mh2 gl" id="gm1" x1="100" y1="100" x2="100" y2="30"/>
        <line class="hh" id="ah" x1="100" y1="100" x2="100" y2="58"/>
        <line class="mh2" id="am" x1="100" y1="100" x2="100" y2="30"/>
        <line class="sh" id="as" x1="100" y1="112" x2="100" y2="22"/>
        <circle class="dot" cx="100" cy="100" r="5"/>
      </svg>
      <div class="time" id="time">--:--</div></div><div class="clockbox"><div class="clocklabel">INDIA · IST</div><svg class="analog" id="analogIn" viewBox="0 0 200 200" aria-label="India analog clock"><circle class="face" cx="100" cy="100" r="94"/><g id="ticksIn"></g><line class="hh" id="aih" x1="100" y1="100" x2="100" y2="58"/><line class="mh2" id="aim" x1="100" y1="100" x2="100" y2="30"/><line class="sh" id="ais" x1="100" y1="112" x2="100" y2="22"/><circle class="dot" cx="100" cy="100" r="5"/></svg><div class="time" id="timeIn">--:--</div></div></div>
      <div class="wx"><svg id="icon" viewBox="0 0 64 64"></svg>
        <div><div class="temp" id="temp">--°C</div><div class="cond" id="cond">—</div></div></div>

      <div class="forecast">
        <div class="forecast-title">3-DAY FORECAST</div>
        <div class="forecast-grid" id="forecast"></div>
      </div>

      <div class="daylight">
        <div class="daylight-title">DAYLIGHT</div>
        <div class="sunrow">
          <span class="sun-time" id="riseV">--:--</span>
          <div class="sunbar"><span class="sunpos" id="sunpos"></span></div>
          <span class="sun-time" id="setV">--:--</span>
        </div>
        <div class="sunlabels"><span>Sunrise</span><span id="daylen">--h --m daylight</span><span>Sunset</span></div>
      </div>
    </div>
    <div class="card">
      <h2>DETAILS</h2>
      <div class="row"><span>Humidity</span><span id="hum"></span></div>
      <div class="row"><span>Wind</span><span id="wind"></span></div>
      <div class="row"><span>Pressure</span><span id="pres"></span></div>
      <div class="row"><span>Sunrise</span><span id="rise"></span></div>
      <div class="row"><span>Sunset</span><span id="set"></span></div>
    </div>
  </section>
  <section class="card cal">
    <h2 class="mh"><button id="prev" aria-label="Previous month">&#8249;</button><span id="month"></span><button id="next" aria-label="Next month">&#8250;</button></h2>
    <div class="grid" id="grid"></div>
    <div class="foot" id="foot"></div>
    <div class="tools"><button id="inv" aria-pressed="false" title="Invert display (I)">&#9680; Invert</button></div>
    <div class="news">
      <div class="news-title">TODAY'S NEWS · DELFT / NL</div>
      <div class="news-status" id="newsStatus">Loading latest headlines…</div>
      <div class="news-list" id="newsList"></div>
    </div>
  </section>


</main>

<div id="flash"></div>
<dialog id="dlg">
  <strong>Edit display</strong>
  <label>Location<input id="f_loc"></label>
  <label>Temperature (°C)<input id="f_temp" type="number"></label>
  <label>Condition<select id="f_cond"><option>Clear</option><option>Few clouds</option><option>Broken clouds</option><option>Rain</option><option>Snow</option></select></label>
  <label>Humidity %<input id="f_hum" type="number"></label>
  <label>Wind m/s<input id="f_wind" type="number" step="0.1"></label>
  <label>Pressure hPa<input id="f_pres" type="number"></label>
  <label>Sunrise<input id="f_rise" type="time"></label>
  <label>Sunset<input id="f_set" type="time"></label>
  <button id="save">Save</button>
</dialog>

<script>
var KEY="eink-dash";
try{if(localStorage.getItem("eink-inv")==="1")document.documentElement.classList.add("inv")}catch(e){}
var S={loc:"Delft · NL",temp:18,cond:"Broken clouds",hum:72,wind:4.1,pres:1012,rise:"07:12",set:"19:05",riseISO:"",setISO:""};
try{var s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)S=Object.assign(S,s)}catch(e){}
var $=function(i){return document.getElementById(i)};

// ===== E-INK SETTINGS =====
var SECOND_HAND=true;       // show the red second hand (real e-ink panels usually update once a minute; set false for that)
var FULL_REFRESH_MIN=10;    // full black/white flash every N minutes (0 = never)
var GHOST_SECONDS=30;       // how long old content lingers as a faint ghost
document.documentElement.style.setProperty("--gf",GHOST_SECONDS+"s");

var ghostOn=false,busy=false;
// set text and leave the previous text behind as a fading ghost (partial refresh)
function setG(el,val,html,quiet){
 var prev=el.innerText;
 if(html)el.innerHTML=val;else el.textContent=val;
 if(ghostOn&&!quiet&&prev&&prev!==el.innerText&&prev!=="\u2014"&&prev!=="--:--"){
  el.dataset.g=prev;el.classList.remove("gh");void el.offsetWidth;el.classList.add("gh");
 }
}
function clearGhosts(){
 document.querySelectorAll(".gh").forEach(function(e){e.classList.remove("gh")});
 ["gh1","gm1"].forEach(function(id){$(id).getAnimations().forEach(function(a){a.cancel()})});
}
// full refresh: black - white - black - white flash, content swaps while the screen is white, ghosts wiped
function fullRefresh(fn){
 if(busy){fn&&fn();return}
 busy=true;
 var a=$("flash").animate([
  {offset:0,opacity:0,backgroundColor:"#111"},
  {offset:.10,opacity:1,backgroundColor:"#111"},
  {offset:.28,opacity:1,backgroundColor:"#111"},
  {offset:.281,opacity:1,backgroundColor:"#f4f4f1"},
  {offset:.46,opacity:1,backgroundColor:"#f4f4f1"},
  {offset:.461,opacity:1,backgroundColor:"#111"},
  {offset:.64,opacity:1,backgroundColor:"#111"},
  {offset:.641,opacity:1,backgroundColor:"#f4f4f1"},
  {offset:.78,opacity:1,backgroundColor:"#f4f4f1"},
  {offset:1,opacity:0,backgroundColor:"#f4f4f1"}
 ],{duration:1600,easing:"linear"});
 setTimeout(function(){clearGhosts();fn&&fn()},1100);
 a.onfinish=a.oncancel=function(){busy=false};
}
function flashEl(el){ // quick invert blink = partial refresh of a small area
 if(el&&el.animate)el.animate([{filter:"invert(1)"},{filter:"invert(1)",offset:.35},{filter:"none"}],{duration:450,easing:"steps(3,end)"});
}
var ICONS={
 "Clear":'<circle cx="32" cy="32" r="10"/><path d="M32 8v6M32 50v6M8 32h6M50 32h6M15 15l4 4M45 45l4 4M49 15l-4 4M19 45l-4 4"/>',
 "Few clouds":'<circle cx="24" cy="24" r="7"/><path d="M24 9v4M10 24h4M14 14l3 3M34 14l-3 3"/><path d="M22 50h26a8 8 0 0 0 0-16 11 11 0 0 0-21-2 8 8 0 0 0-5 18z"/>',
 "Broken clouds":'<path d="M18 46h28a9 9 0 0 0 0-18 13 13 0 0 0-25-3 10 10 0 0 0-3 21z"/><path d="M26 22a9 9 0 0 1 16-3"/>',
 "Rain":'<path d="M18 38h28a9 9 0 0 0 0-18 13 13 0 0 0-25-3 10 10 0 0 0-3 21z"/><path d="M22 46l-3 8M33 46l-3 8M44 46l-3 8"/>',
 "Snow":'<path d="M18 36h28a9 9 0 0 0 0-18 13 13 0 0 0-25-3 10 10 0 0 0-3 21z"/><path d="M22 46v6M19 49h6M34 46v6M31 49h6M46 46v6M43 49h6"/>'};
function t12(v){var p=v.split(":"),h=+p[0];return (h%12||12)+":"+p[1]+" "+(h<12?"AM":"PM")}

var FC=[];
function fcIcon(c){
 if(c===0)return "☀";
 if(c<=2)return "◐";
 if(c<=48)return "☁";
 if((c>=71&&c<=77)||c===85||c===86)return "❄";
 return "☂";
}
function hm(iso){return iso?iso.slice(11,16):"--:--";}
function minutesFromMidnight(iso){
 if(!iso)return null;
 var p=iso.slice(11,16).split(":");
 return (+p[0])*60+(+p[1]);
}
function daylightUI(){
 var rise=$("riseV"),set=$("setV");
 if(!rise||!set)return;
 setG(rise,t12(S.rise),false,true);
 setG(set,t12(S.set),false,true);
 var a=minutesFromMidnight(S.riseISO),b=minutesFromMidnight(S.setISO);
 if(a===null||b===null){$("sunpos").style.left="50%";$("daylen").textContent="--h --m daylight";return;}
 var n=new Date(),now=n.getHours()*60+n.getMinutes()+n.getSeconds()/60;
 var pct=Math.max(0,Math.min(100,(now-a)/(b-a)*100));
 $("sunpos").style.left=pct+"%";
 var mins=Math.max(0,b-a),hh=Math.floor(mins/60),mm=Math.round(mins%60);
 $("daylen").textContent=hh+"h "+String(mm).padStart(2,"0")+"m daylight";
}
function renderForecast(){
 var el=$("forecast"); if(!el)return;
 el.innerHTML="";
 FC.forEach(function(f,i){
   var d=new Date(f.date+"T12:00:00");
   var day=i===0?"TODAY":d.toLocaleDateString("en-US",{weekday:"short"}).toUpperCase();
   var e=document.createElement("div");e.className="fc";
   e.innerHTML='<div class="fc-day">'+day+'</div><div class="fc-icon">'+fcIcon(f.code)+'</div>'+
     '<div class="fc-temp">'+Math.round(f.max)+"° <span class=\"fc-low\">"+Math.round(f.min)+"°</span></div>";
   el.appendChild(e);
 });
 daylightUI();
}
function renderWx(quiet){
 var q=quiet===true;
 setG($("loc"),S.loc,false,q);setG($("temp"),Math.round(S.temp)+"\u00b0C",false,q);setG($("cond"),S.cond,false,q);
 var ic=$("icon");
 if(ic.dataset.c!==S.cond){ic.innerHTML=ICONS[S.cond]||ICONS["Clear"];ic.dataset.c=S.cond;if(ghostOn&&!q)flashEl(ic)}
 setG($("hum"),S.hum+"%",false,q);setG($("wind"),S.wind+" m/s",false,q);setG($("pres"),S.pres+" hPa",false,q);
 setG($("rise"),t12(S.rise),false,q);setG($("set"),t12(S.set),false,q);
 renderForecast();
}
(function(){var g="",i,a,big,r1,r2;
 for(i=0;i<60;i++){a=i*6*Math.PI/180;big=i%5===0;r1=big?78:85;r2=90;
  g+='<line class="tk'+(big?' big':'')+'" x1="'+(100+r1*Math.sin(a)).toFixed(2)+'" y1="'+(100-r1*Math.cos(a)).toFixed(2)+'" x2="'+(100+r2*Math.sin(a)).toFixed(2)+'" y2="'+(100-r2*Math.cos(a)).toFixed(2)+'"/>'}
 $("ticks").innerHTML=g})();
(function(){var g="",i,a,big,r1,r2;for(i=0;i<60;i++){a=i*6*Math.PI/180;big=i%5===0;r1=big?78:85;r2=90;g+='<line class="tk'+(big?' big':'')+'" x1="'+(100+r1*Math.sin(a)).toFixed(2)+'" y1="'+(100-r1*Math.cos(a)).toFixed(2)+'" x2="'+(100+r2*Math.sin(a)).toFixed(2)+'" y2="'+(100-r2*Math.cos(a)).toFixed(2)+'"/>'}$("ticksIn").innerHTML=g})();
var pha=null,pma=null;
function ghostHand(id,ang){
 var e=$(id);e.setAttribute("transform","rotate("+ang+" 100 100)");
 e.getAnimations().forEach(function(x){x.cancel()});
 e.animate([{opacity:.22},{opacity:0}],{duration:GHOST_SECONDS*1000,easing:"linear",fill:"forwards"});
}
function drawClock(g){
 var n=new Date(),h=n.getHours(),m=n.getMinutes(),sec=n.getSeconds();
 setG($("time"),String(h%12||12).padStart(2,"0")+":"+String(m).padStart(2,"0")+" "+(h<12?"AM":"PM"),false,!g);
 var ha=((h%12)+m/60)*30,ma=m*6;
 if(g&&pma!==null){ghostHand("gh1",pha);ghostHand("gm1",pma)}
 $("ah").setAttribute("transform","rotate("+ha+" 100 100)");
 $("am").setAttribute("transform","rotate("+ma+" 100 100)");
 $("as").setAttribute("transform","rotate("+(sec*6)+" 100 100)");
 pha=ha;pma=ma;
 var parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Kolkata",hour:"numeric",minute:"2-digit",second:"2-digit",hour12:true}).formatToParts(n);
 var ih=+parts.find(function(x){return x.type==="hour"}).value,im=+parts.find(function(x){return x.type==="minute"}).value,is=+parts.find(function(x){return x.type==="second"}).value,dp=parts.find(function(x){return x.type==="dayPeriod"}).value;
 setG($("timeIn"),String(ih).padStart(2,"0")+":"+String(im).padStart(2,"0")+" "+dp,false,!g);
 $("aih").setAttribute("transform","rotate("+(((ih%12)+im/60)*30)+" 100 100)");
 $("aim").setAttribute("transform","rotate("+(im*6)+" 100 100)");
 $("ais").setAttribute("transform","rotate("+(is*6)+" 100 100)");
}
var BM={};try{BM=JSON.parse(localStorage.getItem("eink-bm")||"{}")}catch(e){}
// Second copy in IndexedDB (survives cases where localStorage is not flushed/cleared)
var idb=null;
function idbOpen(cb){try{var q=indexedDB.open("eink-db",1);
 q.onupgradeneeded=function(){q.result.createObjectStore("kv")};
 q.onsuccess=function(){idb=q.result;cb&&cb()};q.onerror=function(){}}catch(e){}}
function idbSave(){if(!idb)return;try{idb.transaction("kv","readwrite").objectStore("kv").put(JSON.stringify(BM),"bm")}catch(e){}}
function idbLoad(){if(!idb)return;try{var r=idb.transaction("kv").objectStore("kv").get("bm");
 r.onsuccess=function(){try{var o=JSON.parse(r.result||"{}");var ch=false;
  for(var k in o){if(!BM[k]){BM[k]=1;ch=true}}
  if(ch){try{localStorage.setItem("eink-bm",JSON.stringify(BM))}catch(e){}renderCal(true)}}catch(e){}}}catch(e){}}
function saveBM(){try{localStorage.setItem("eink-bm",JSON.stringify(BM))}catch(e){}idbSave()}
idbOpen(idbLoad);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
var lastDay=-1,off=0;
function renderCal(force,quiet){
 var n=new Date();lastDay=n.getDate();
 var v=new Date(n.getFullYear(),n.getMonth()+off,1),y=v.getFullYear(),mo=v.getMonth();
 var cur=(y===n.getFullYear()&&mo===n.getMonth());
 $("month").textContent=v.toLocaleDateString("en",{month:"long",year:"numeric"});
 $("month").style.cursor=cur?"default":"pointer";
 var g=$("grid");g.innerHTML="";
 ["Su","Mo","Tu","We","Th","Fr","Sa"].forEach(function(d){var e=document.createElement("div");e.className="dow";e.textContent=d;g.appendChild(e)});

 setG($("foot"),n.toLocaleDateString("en",{weekday:"long",day:"numeric",month:"long"})+"<br>Week "+wk+" \u00b7 Day "+doy+selInfo(),true,quiet);
}

 var diff=Math.round((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/864e5);
 var txt=diff===0?"Today":diff>0?"in "+diff+(diff===1?" day":" days"):Math.abs(diff)+(diff===-1?" day":" days")+" ago";
 return "<br><b style=\"color:"+(BM[sel]?"#c62828":"inherit")+"\">"+t.toLocaleDateString("en",{weekday:"short",day:"numeric",month:"short",year:"numeric"})+" \u00b7 "+txt+"</b>";
}

var lastMin=-1;

}

// Live weather for the device's location (needs network access: run this file locally)
function cond(c){
 if(c===0)return "Clear"; if(c<=2)return "Few clouds"; if(c<=48)return "Broken clouds";
 if((c>=71&&c<=77)||c===85||c===86)return "Snow"; return "Rain";
}
async function loadWeather(lat,lon,name){
 try{
  var r=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+
   "&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&forecast_days=3&timezone=auto&wind_speed_unit=ms");
  var d=await r.json(),c=d.current;
  S.temp=c.temperature_2m;S.hum=c.relative_humidity_2m;S.pres=Math.round(c.surface_pressure);
  S.wind=c.wind_speed_10m;S.cond=cond(c.weather_code);
  S.riseISO=d.daily.sunrise[0];S.setISO=d.daily.sunset[0];
  S.rise=hm(S.riseISO);S.set=hm(S.setISO);
  FC=[];
  for(var i=0;i<Math.min(3,d.daily.time.length);i++){
   FC.push({date:d.daily.time[i],code:d.daily.weather_code[i],max:d.daily.temperature_2m_max[i],min:d.daily.temperature_2m_min[i]});
  }
  if(name)S.loc=name; renderWx();ghostOn=true;
 }catch(e){}
}
async function placeName(lat,lon){
 try{
  var r=await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+lat+"&longitude="+lon+"&localityLanguage=en");
  var j=await r.json(); return (j.city||j.locality||"Here")+" \u00b7 "+(j.countryCode||"");
 }catch(e){return null}
}
function locate(){
 var fallback=function(){loadWeather(52.01,4.36,null)};
 if(!navigator.geolocation)return fallback();
 navigator.geolocation.getCurrentPosition(async function(p){
  var la=p.coords.latitude.toFixed(3),lo=p.coords.longitude.toFixed(3);
  loadWeather(la,lo,await placeName(la,lo));
 },fallback,{timeout:10000,maximumAge:600000});
}
locate();setInterval(locate,15*60*1000);



// ===== PARSED LIVE NEWS =====
// Use Jina Reader to turn current news pages into browser-readable text.
// Sources: Omroep Delft (local) + NL Times (Netherlands, English).
var NEWS_SOURCES=[
 {url:"https://www.omroepdelft.nl/delft/",name:"Delft"},
 {url:"https://nltimes.nl/",name:"Netherlands"}
];

function escNews(v){
 return String(v||"").replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
 });
}

function cleanNewsTitle(t){
 return String(t||"")
  .replace(/^\s*(Image|Video)\s*:\s*/i,"")
  .replace(/\s+/g," ")
  .trim();
}

function parseReaderText(text,source){
 var out=[],seen={};
 var lines=text.split(/\r?\n/);

 for(var i=0;i<lines.length;i++){
  var line=lines[i].trim();

  // Markdown headings commonly used by Jina Reader.
  var m=line.match(/^#{2,4}\s+(.+)$/);
  if(m){
   var title=cleanNewsTitle(m[1]);
   if(title && title.length>18 && title.length<180 &&
      !/^(Delft|Delftse Hout|Delft Regio|Politiek|Politics|Business|Crime|Health|Culture|Lifestyle|Top stories|Latest news)$/i.test(title)){
    var key=title.toLowerCase();
    if(!seen[key]){
     seen[key]=1;
     var link="";
     for(var j=i+1;j<Math.min(i+5,lines.length);j++){
      var lm=lines[j].match(/\]\((https?:\/\/[^)]+)\)/);
      if(lm){link=lm[1];break;}
     }
     out.push({title:title,link:link,source:source,time:""});
    }
   }
  }

  // Also catch Markdown link lines when no heading was emitted.
  var lm=line.match(/^\[([^\]]{18,180})\]\((https?:\/\/[^)]+)\)/);
  if(lm){
   var lt=cleanNewsTitle(lm[1]),lk=lm[2],kk=lt.toLowerCase();
   if(!seen[kk] && !/^(About|Contact|Privacy|Advertise|Subscribe)$/i.test(lt)){
    seen[kk]=1;out.push({title:lt,link:lk,source:source,time:""});
   }
  }
 }
 return out;
}

async function getParsedSource(src){
 var reader="https://r.jina.ai/"+src.url;
 var r=await fetch(reader,{cache:"no-store"});
 if(!r.ok)throw new Error("news source");
 var text=await r.text();
 return parseReaderText(text,src.name).slice(0,8);
}

async function translateDutchTitle(title){
 // Translate Delft/Oud-Dutch headlines to English in the browser.
 // Google Translate's lightweight endpoint is used only for the short headline text.
 try{
  var q=encodeURIComponent(title);
  var u="https://translate.googleapis.com/translate_a/single?client=gtx&sl=nl&tl=en&dt=t&q="+q;
  var r=await fetch(u,{cache:"no-store"});
  if(!r.ok)throw new Error("translation");
  var data=await r.json();
  if(data && data[0]){
   var translated=data[0].map(function(x){return x&&x[0]?x[0]:"";}).join("").trim();
   if(translated)return translated;
  }
 }catch(e){}
 return title;
}

async function loadNews(){
 var status=$("newsStatus"),list=$("newsList");
 status.textContent="Updating…";

 var all=[];
 var results=await Promise.allSettled(NEWS_SOURCES.map(getParsedSource));
 results.forEach(function(r){
  if(r.status==="fulfilled")all=all.concat(r.value);
 });

 // Prefer Delft headlines first, then Netherlands headlines.
 all.sort(function(a,b){
  if(a.source!==b.source)return a.source==="Delft"?-1:1;
  return 0;
 });

 var seen={},unique=[];
 all.forEach(function(n){
  var k=n.title.toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  if(k&&!seen[k]){
   seen[k]=1;
   unique.push(n);
  }
 });

 unique=unique.slice(0,6);

 // Translate Dutch Delft headlines while leaving NL Times headlines unchanged.
 unique=await Promise.all(unique.map(async function(n){
  if(n.source==="Delft") n.displayTitle=await translateDutchTitle(n.title);
  else n.displayTitle=n.title;
  return n;
 }));

 if(!unique.length){
  status.textContent="News feed unavailable · retrying";
  list.innerHTML='<div class="news-item"><div class="nt">Unable to parse today’s headlines</div><div class="ns">Automatic retry in 15 min</div></div>';
  return;
 }

 list.innerHTML="";
 unique.forEach(function(n){
  var a=document.createElement("a");
  a.className="news-item";
  a.href=n.link||"#";
  a.target="_blank";
  a.rel="noopener noreferrer";
  a.innerHTML='<div class="nt">'+escNews(n.displayTitle||n.title)+'</div>'+
             '<div class="ns">'+escNews(n.source)+(n.time?" · "+escNews(n.time):"")+'</div>';
  list.appendChild(a);
 });

 status.textContent="Live headlines · "+new Date().toLocaleTimeString("en-NL",{hour:"2-digit",minute:"2-digit",hour12:false});
}

loadNews();
setInterval(loadNews,15*60*1000);
